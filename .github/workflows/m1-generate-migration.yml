name: M1 Generate Migration

on:
  push:
    branches:
      - codex/m1-family-baby-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m1-generate-migration
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate M1 migration
        shell: bash
        run: |
          rm -f migrations/.gitkeep
          ./apps/api/node_modules/.bin/drizzle-kit generate --config drizzle.config.ts --name m1_family_identity
      - name: Commit generated migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations
          git diff --cached --quiet && { echo "Expected generated migration was empty"; exit 1; }
          git commit -m "chore: generate M1 family identity migration"
          git push origin HEAD:codex/m1-family-baby-foundation
