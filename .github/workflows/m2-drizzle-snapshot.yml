name: M2 Drizzle Snapshot

on:
  push:
    branches:
      - codex/m2-task11-release-gate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-drizzle-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Seed M1 snapshot baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf diagnostics/drizzle-m2
          mkdir -p diagnostics/drizzle-m2/meta
          cp migrations/0000_m1_family_identity.sql diagnostics/drizzle-m2/0000_m1_family_identity.sql
          cp migrations/meta/0000_snapshot.json diagnostics/drizzle-m2/meta/0000_snapshot.json
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('migrations/meta/_journal.json','utf8')); j.entries=j.entries.filter((e)=>e.idx===0); fs.writeFileSync('diagnostics/drizzle-m2/meta/_journal.json', JSON.stringify(j,null,2)+'\n');"
      - name: Generate snapshot with Drizzle Kit
        shell: bash
        env:
          DRIZZLE_OUT: ./diagnostics/drizzle-m2
        run: |
          set -o pipefail
          pnpm --filter @baby-care/api exec drizzle-kit generate --config "$GITHUB_WORKSPACE/drizzle.config.ts" --name m2_care_recording 2>&1 | tee /tmp/drizzle-snapshot.log
      - name: Verify generated files
        shell: bash
        run: |
          set -euo pipefail
          test -f diagnostics/drizzle-m2/meta/0001_snapshot.json
          test "$(find diagnostics/drizzle-m2 -maxdepth 1 -type f -name '0001_*.sql' | wc -l | tr -d ' ')" = "1"
          ls -la diagnostics/drizzle-m2 diagnostics/drizzle-m2/meta
      - name: Upload generator log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m2-drizzle-snapshot-log-${{ github.run_id }}
          path: /tmp/drizzle-snapshot.log
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: m2-drizzle-snapshot-${{ github.run_id }}
          path: diagnostics/drizzle-m2/
          retention-days: 3
