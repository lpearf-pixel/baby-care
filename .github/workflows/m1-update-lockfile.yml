name: M1 Update Lockfile

on:
  push:
    branches:
      - codex/m1-e-family-authorization
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m1-e-lockfile
  cancel-in-progress: true

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet && { echo "Lockfile already current"; exit 0; }
          git commit -m "chore: update M1 workspace lockfile"
          git push origin HEAD:codex/m1-e-family-authorization
