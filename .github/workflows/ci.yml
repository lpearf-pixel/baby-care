name: Baby Care CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baby-care-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee /tmp/static.log
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee /tmp/static.log
      - name: Collect compact diagnostics
        if: failure()
        env:
          DIAG_STAGE: static
          DIAG_COMPONENT: workspace
          DIAG_EVENT_CODE: STATIC_GATE_FAILED
          DIAG_EVIDENCE_FILE: /tmp/static.log
        run: node scripts/collect-diagnostics.mjs
      - name: Upload compact diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-static-${{ github.run_id }}
          path: diagnostics/latest/
          retention-days: 3

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit and contract tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/unit.log
      - name: Collect compact diagnostics
        if: failure()
        env:
          DIAG_STAGE: unit
          DIAG_COMPONENT: workspace
          DIAG_EVENT_CODE: UNIT_GATE_FAILED
          DIAG_EVIDENCE_FILE: /tmp/unit.log
        run: node scripts/collect-diagnostics.mjs
      - name: Upload compact diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-unit-${{ github.run_id }}
          path: diagnostics/latest/
          retention-days: 3

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: babycare_test
          POSTGRES_USER: babycare
          POSTGRES_PASSWORD: babycare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U babycare -d babycare_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      postgres_restore:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: babycare_restore_test
          POSTGRES_USER: babycare
          POSTGRES_PASSWORD: babycare
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U babycare -d babycare_restore_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: PostgreSQL and API integration
        shell: bash
        env:
          TEST_DATABASE_URL: postgres://babycare:babycare@127.0.0.1:5432/babycare_test
          TEST_RESTORE_DATABASE_URL: postgres://babycare:babycare@127.0.0.1:5433/babycare_restore_test
          BABY_CARE_PG16_INTEGRATION: "1"
        run: |
          set -o pipefail
          pnpm --filter @baby-care/api test 2>&1 | tee /tmp/integration.log
          pnpm --filter @baby-care/operations test -- restore.integration.test.ts 2>&1 | tee -a /tmp/integration.log
      - name: Collect compact diagnostics
        if: failure()
        env:
          DIAG_STAGE: integration
          DIAG_COMPONENT: api-postgres
          DIAG_EVENT_CODE: INTEGRATION_GATE_FAILED
          DIAG_EVIDENCE_FILE: /tmp/integration.log
        run: node scripts/collect-diagnostics.mjs
      - name: Upload compact diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-integration-${{ github.run_id }}
          path: diagnostics/latest/
          retention-days: 3

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production builds
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/build.log
      - name: Collect compact diagnostics
        if: failure()
        env:
          DIAG_STAGE: build
          DIAG_COMPONENT: workspace
          DIAG_EVENT_CODE: BUILD_GATE_FAILED
          DIAG_EVIDENCE_FILE: /tmp/build.log
        run: node scripts/collect-diagnostics.mjs
      - name: Upload compact diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-build-${{ github.run_id }}
          path: diagnostics/latest/
          retention-days: 3

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and start stack
        shell: bash
        run: |
          set -o pipefail
          docker compose --project-name baby-care up -d --build 2>&1 | tee /tmp/compose.log
      - name: Probe Web and API through Web
        shell: bash
        run: |
          set -o pipefail
          node scripts/compose-smoke.mjs 2>&1 | tee -a /tmp/compose.log
      - name: Reset to a new empty M4 source volume
        shell: bash
        run: |
          set -o pipefail
          docker compose --project-name baby-care down -v --remove-orphans 2>&1 | tee -a /tmp/compose.log
          docker compose --profile operations --project-name baby-care --file compose.yaml --file infra/backup/compose.operations.yaml up -d --build postgres api web 2>&1 | tee -a /tmp/compose.log
      - name: Build fixed operations CLI
        run: pnpm --filter @baby-care/operations build
      - name: Exercise M4 export backup and isolated restore
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @baby-care/api exec tsx ../../scripts/m4-birth-ready-operations.mjs 2>&1 | tee -a /tmp/compose.log
      - name: Capture bounded service state
        if: failure()
        shell: bash
        run: |
          docker compose --project-name baby-care ps 2>&1 | tee -a /tmp/compose.log
          docker compose --profile operations --project-name baby-care-restore --file compose.yaml --file infra/backup/compose.operations.yaml ps 2>&1 | tee -a /tmp/compose.log
      - name: Collect compact diagnostics
        if: failure()
        env:
          DIAG_STAGE: compose-smoke
          DIAG_COMPONENT: docker-compose
          DIAG_EVENT_CODE: COMPOSE_SMOKE_FAILED
          DIAG_EVIDENCE_FILE: /tmp/compose.log
        run: node scripts/collect-diagnostics.mjs
      - name: Upload compact diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-compose-${{ github.run_id }}
          path: diagnostics/latest/
          retention-days: 3
      - name: Tear down disposable stack
        if: always()
        shell: bash
        run: |
          restore_status=0
          source_status=0
          docker compose --profile operations --project-name baby-care-restore --file compose.yaml --file infra/backup/compose.operations.yaml down -v --remove-orphans --timeout 10 || restore_status=$?
          docker compose --project-name baby-care down -v --remove-orphans --timeout 10 || source_status=$?
          test "$restore_status" -eq 0
          test "$source_status" -eq 0
