services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-babycare}
      POSTGRES_USER: ${POSTGRES_USER:-babycare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-babycare}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-babycare} -d ${POSTGRES_DB:-babycare}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - baby-care-db:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8787
      DATABASE_URL: postgresql://${POSTGRES_USER:-babycare}:${POSTGRES_PASSWORD:-babycare}@db:5432/${POSTGRES_DB:-babycare}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      BABY_DISPLAY_NAME: ${BABY_DISPLAY_NAME:-xiangxiang}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      - "8787:8787"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
volumes:
  baby-care-db:
